<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>pin2map · isolierter MapLibre-Prototyp</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css">
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,sans-serif;color:#172b49}
header{height:58px;background:#172b49;color:white;padding:12px 16px;display:flex;align-items:center;gap:12px}
header strong{font-size:17px}header span{font-size:12px;opacity:.85}
/* Disable Safari double-tap smart zoom on non-map informational chrome; keep normal pinch zoom elsewhere. */
header,.status,footer{touch-action:manipulation}
#map{position:absolute;top:58px;bottom:0;left:0;right:0}
.status{position:absolute;z-index:8;top:72px;left:12px;right:12px;max-width:440px;padding:11px 13px;border-radius:8px;background:white;box-shadow:0 3px 20px #0003;font-size:13px}
.prototype-zoom{position:absolute;top:76px;right:12px;z-index:10;display:flex;flex-direction:column;gap:4px}
button{cursor:pointer;background:#214d83;color:white;border:0;border-radius:7px;padding:8px 12px}
.prototype-zoom button{font-size:21px;min-width:42px;min-height:42px;background:white;color:#172b49;box-shadow:0 2px 9px #0003}
.pin-icon{background:transparent;cursor:pointer}
.pin-marker{width:24px;height:24px;background:#df593e;border:3px solid white;border-radius:50% 50% 50% 3px;transform:rotate(-45deg);box-shadow:0 1px 5px #0008}
.pin-marker.selected{width:30px;height:30px;outline:2px solid #172b49}
.pin-label{position:absolute;white-space:nowrap;top:-20px;left:35px;color:#172b49;background:white;padding:4px 7px;border-radius:6px;box-shadow:0 1px 6px #0003}
footer{position:absolute;bottom:18px;left:12px;z-index:9;background:white;padding:8px 11px;border-radius:8px;font-size:12px;max-width:75vw}
</style>
</head>
<body>
<header><strong>pin2map · MapLibre</strong><span>Separater technischer Prototyp · keine gespeicherten Pins</span></header>
<div id="map" aria-label="MapLibre-Testkarte"></div>
<div id="status" class="status" role="status">MapLibre wird geladen …</div>
<footer>Antippen: Pin auswählen · + / −: Zoom · ◎: Pins einpassen. Kein Offline-Test.</footer>
<script type="module" src="./maplibre-prototype.js"></script>
</body>
</html>

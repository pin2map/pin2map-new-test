name: Deploy modular development preview alongside stable site

on:
  push:
    branches: [feature/leaflet-modular-core]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Share the GitHub Pages deployment lock with the main-site workflow.
# Preview deployments must not be blocked by a stale Pages concurrency
# holder. The deploy artifact still contains the unchanged checked-out main
# site at its root and only overlays the development app under /preview/.
concurrency:
  group: pin2map-modular-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    steps:
      - name: Check out unchanged published main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-root
          persist-credentials: false

      - name: Check out modular development code
        uses: actions/checkout@v4
        with:
          ref: feature/leaflet-modular-core
          path: preview-source
          persist-credentials: false

      - name: Validate development code before publishing
        working-directory: preview-source
        run: |
          find domain application adapters ui -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check app.js
          node --check sw.js
          node --test tests/*.test.js
          for test_file in tests/check-*.mjs; do node "$test_file"; done

      - name: Package only active modules referenced by the offline shell
        run: |
          python3 preview-source/scripts/preview-bundle.py preview-source site-root/preview

      - name: Assert Preview allowlist excludes historical experiments
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("site-root/preview")
          forbidden=("maplibre", "pmtiles", "osm-raster-parity", "diagnostics.html", "tests/", "docs/", "scripts/")
          files=[p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file()]
          unexpected=[f for f in files if any(fragment in f for fragment in forbidden)]
          assert not unexpected, "Non-app experiments published: "+repr(unexpected)
          assert "index.html" in files and "sw.js" in files and "app.js" in files
          print("PASS: only application assets, no historical experiment routes")
          PY

      - name: Vendor pinned Leaflet into the published preview
        run: |
          set -euo pipefail
          mkdir -p site-root/preview/vendor/leaflet/images
          base="https://unpkg.com/leaflet@1.9.4/dist"
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 \
            "$base/leaflet.js" -o site-root/preview/vendor/leaflet/leaflet.js
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 \
            "$base/leaflet.css" -o site-root/preview/vendor/leaflet/leaflet.css
          for image in marker-icon.png marker-icon-2x.png marker-shadow.png layers.png layers-2x.png; do
            curl --fail --location --silent --show-error --retry 4 --retry-delay 2 \
              "$base/images/$image" -o "site-root/preview/vendor/leaflet/images/$image"
          done
          python3 - <<'PY'
          import base64,hashlib,re
          from pathlib import Path
          root=Path("site-root/preview")
          html=(root/"index.html").read_text(encoding="utf-8")
          version="https://unpkg.com/leaflet@1.9.4/dist/"
          for filename in ("leaflet.css","leaflet.js"):
              signature=re.search(re.escape(version+filename) +
                                  r'[^>]*integrity="sha256-([^"]+)"',html)
              if not signature:raise SystemExit("Missing Leaflet integrity: "+filename)
              body=(root/"vendor/leaflet"/filename).read_bytes()
              actual=base64.b64encode(hashlib.sha256(body).digest()).decode()
              if actual!=signature.group(1):
                  raise SystemExit("Leaflet integrity mismatch: "+filename)
              html=html.replace(version+filename,"./vendor/leaflet/"+filename)
          (root/"index.html").write_text(html,encoding="utf-8")
          worker=root/"sw.js"
          sw=worker.read_text(encoding="utf-8")
          for filename in ("leaflet.css","leaflet.js"):
              sw=sw.replace(version+filename,"./vendor/leaflet/"+filename)
          worker.write_text(sw,encoding="utf-8")
          print("Vendored SRI-verified Leaflet; no external CDN needed at runtime")
          PY

      - name: Isolate preview IndexedDB, service worker caches and app identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          preview = Path("site-root/preview")
          def replace_exact(name, old, new):
              path = preview / name
              before = path.read_text(encoding="utf-8")
              if old not in before:
                  raise RuntimeError(f"Expected preview isolation target missing: {name}: {old}")
              path.write_text(before.replace(old, new), encoding="utf-8")

          # Browser IndexedDB is shared by origin, not pathname.
          # Never allow preview mutations to touch the stable PWA's database.
          replace_exact("adapters/storage/indexeddb-project-store.js",
                        '"pin2map-new-v1"', '"pin2map-new-preview-v1"')

          # Scope caches by preview: the preview worker must not purge the
          # existing root worker's offline app shell on activation.
          replace_exact("sw.js", "pin2map-new-v", "pin2map-preview-v")
          # Separate cleanup prefix: the worker must not delete the main
          # app's cache when a preview worker activates.
          replace_exact("sw.js", "name.startsWith('pin2map-new-')",
                        "name.startsWith('pin2map-preview-')")
          replace_exact("sw.js", "pin2map-viewed-osm-tiles-v1",
                        "pin2map-preview-viewed-osm-tiles-v1")
          replace_exact("sw.js", "pin2map-viewed-osm-tile-metadata-v1",
                        "pin2map-preview-viewed-osm-tile-metadata-v1")

          manifest = preview / "manifest.webmanifest"
          data = json.loads(manifest.read_text(encoding="utf-8"))
          data["name"] = "pin2map NEW – Entwicklungsvorschau"
          data["short_name"] = "pin2map DEV"
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                              encoding="utf-8")

          replace_exact("index.html", "<title>pin2map NEW · Testversion</title>",
                        "<title>pin2map NEW · Entwicklungsvorschau</title>")
          import re
          sw = (preview / "sw.js").read_text(encoding="utf-8")
          version = re.search(r"const CACHE='(pin2map-preview-v\d+)'", sw)
          if not version:
              raise RuntimeError("Missing preview release version")
          html = preview / "index.html"
          source=html.read_text(encoding="utf-8")
          # One immutable URL per release for every app-owned JS/CSS resource.
          # This prevents Safari's HTTP cache from mixing old and new modules.
          import re
          source=re.sub(
              r'((?:src|href)="\./(?:vendor/leaflet/|domain/|application/|adapters/|ui/|map-adapter-leaflet\.js|app\.js|styles\.css)[^"?]*)(?=")',
              lambda match:match.group(1)+"?__p2m_release="+version.group(1),source)
          source=source.replace(
              "</head>", '<meta name="pin2map-preview-version" content="' +
              version.group(1) + '">\n</head>')
          html.write_text(source,encoding="utf-8")
          PY

      - name: Check preview isolation and unchanged stable entrypoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path("site-root/index.html").read_bytes()
          source = Path("preview-source/index.html").read_bytes()
          preview = Path("site-root/preview/index.html").read_text(encoding="utf-8")
          assert main != b"", "Missing stable application"
          assert source != b"", "Missing development application"
          assert "Entwicklungsvorschau" in preview
          assert 'src="./vendor/leaflet/leaflet.js?__p2m_release=' in preview
          assert 'href="./vendor/leaflet/leaflet.css?__p2m_release=' in preview
          assert 'https://unpkg.com/leaflet' not in preview
          assert 'src="./app.js?__p2m_release=' in preview
          assert 'href="./styles.css?__p2m_release=' in preview
          assert (Path("site-root/preview/styles.css").stat().st_size > 1000), "Preview stylesheet missing"
          assert (Path("site-root/preview/app.js").stat().st_size > 1000), "Preview app.js missing"
          assert not (Path("site-root/preview/maplibre-full-integration.html")).exists()
          assert not (Path("site-root/preview/pmtiles-experiment-1.html")).exists()
          assert not (Path("site-root/preview/diagnostics.html")).exists()

          # Custom layer selector must be in the published bundle, not only CI.
          assert 'id="pinLayerPicker"' in preview
          picker = Path("site-root/preview/ui/pin-layer-picker.js").read_text(encoding="utf-8")
          assert "class PinLayerPicker" in picker
          assert ".pin-layer-trigger" in Path("site-root/preview/styles.css").read_text(encoding="utf-8")
          sw = Path("site-root/preview/sw.js").read_text(encoding="utf-8")
          assert "name.startsWith('pin2map-preview-')" in sw
          assert "'./vendor/leaflet/leaflet.js'" in sw
          assert "'./vendor/leaflet/leaflet.css'" in sw
          assert "name.startsWith('pin2map-new-')" not in sw
          assert "pin2map-preview-viewed-osm-tiles-v1" in sw
          store = Path("site-root/preview/adapters/storage/indexeddb-project-store.js").read_text(encoding="utf-8")
          assert '"pin2map-new-preview-v1"' in store
          assert '"pin2map-new-v1"' not in store
          print("Preview is isolated; stable root is checked out from main.")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-root

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published preview HTML CSS JS and service worker over HTTPS
        env:
          PAGES_BASE: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os
          import time
          import re
          import hashlib
          import urllib.request
          from pathlib import Path
          from urllib.parse import urljoin

          base = os.environ["PAGES_BASE"].rstrip("/") + "/preview/"
          source_sw = Path("preview-source/sw.js").read_text(encoding="utf-8")
          source_version = re.search(r"const CACHE='pin2map-new-v(\d+)'", source_sw)
          if not source_version:
              raise SystemExit("FAIL: cannot determine source worker version")
          expected_version = "pin2map-preview-v" + source_version.group(1)
          expected = {
              "index.html": ("text/html", expected_version),
              "vendor/leaflet/leaflet.js": ("javascript", "Leaflet"),
              "vendor/leaflet/leaflet.css": ("text/css", ".leaflet-container"),
              "styles.css": ("text/css", ".pin-panel"),
              "app.js": ("javascript", "Pin2MapPwaRefresh.refresh"),
              "ui/pin-layer-picker.js": ("javascript", "class PinLayerPicker"),
              "ui/search-results.js": ("javascript", "results-footer"),
              "ui/pwa-refresh.js": ("javascript", "const api=Object.freeze"),
              "sw.js": ("javascript", expected_version),
          }
          # Compare both canonical and cache-busted entrypoints: GitHub Pages
          # must serve the same release even if clients have visited /preview/
          # for months. A query string is not a separate application.
          expected[""] = ("text/html", expected_version)
          expected["?__p2m_release=" + expected_version] = ("text/html", expected_version)
          print("Checking clean and release-keyed preview URLs:", base, flush=True)
          for attempt in range(1, 13):
              problems = []
              for relative, (content_type, signature) in expected.items():
                  url = urljoin(base, relative)
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={"Cache-Control":"no-cache", "User-Agent":"pin2map-preview-deploy-check"})
                      with urllib.request.urlopen(request, timeout=15) as response:
                          response_bytes = response.read()
                          body = response_bytes.decode("utf-8", errors="replace")
                          actual_type = response.headers.get("Content-Type", "").lower()
                          if content_type not in actual_type:
                              problems.append(f"{relative}: wrong MIME {actual_type}")
                          if signature not in body:
                              problems.append(f"{relative}: missing expected content marker")
                          # A matching marker does not prove that the CSS release
                          # is current. Compare actual published bytes with the
                          # exact development stylesheet included in this run.
                          if relative == "styles.css":
                              expected_bytes = Path("preview-source/styles.css").read_bytes()
                              if hashlib.sha256(response_bytes).digest() != hashlib.sha256(expected_bytes).digest():
                                  problems.append("styles.css: published bytes differ from source checkout")
                  except Exception as error:
                      problems.append(f"{relative}: {error}")
              if not problems:
                  print("PASS: exact preview worker version and all updated assets served.")
                  break
              print(f"Attempt {attempt}/12: "+"; ".join(problems), flush=True)
              if attempt == 12:
                  raise SystemExit("FAIL: published preview assets are missing or mismatched")
              time.sleep(10)
          PY

      - name: Use runner Chrome for published-site regression
        working-directory: preview-source
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || true)
          if [ -z "$CHROME" ]; then echo "No system Chrome found" >&2; exit 1; fi
          echo "PIN2MAP_CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"

      - name: Confirm live Leaflet startup on clean URL and tracking URL
        working-directory: preview-source
        env:
          PIN2MAP_LIVE_PREVIEW: ${{ steps.deployment.outputs.page_url }}preview/
        run: node tests/preview-live-smoke.cjs

      - name: Verify published geometry searches and objects with Chromium
        working-directory: preview-source
        env:
          PIN2MAP_TEST_URL: ${{ steps.deployment.outputs.page_url }}preview/
        run: node tests/geometry-browser.cjs
      - name: Confirm live autozoom disentangles pin hitboxes and allows exact-coordinate choice
        working-directory: preview-source
        env:
          PIN2MAP_TEST_URL: ${{ steps.deployment.outputs.page_url }}preview/
        run: node tests/pin-overlap-browser.cjs

      - name: Visual verification of actually published Pin dialog and layer chooser
        working-directory: preview-source
        env:
          PIN2MAP_TEST_URL: ${{ steps.deployment.outputs.page_url }}preview/
        run: node tests/pin-dialog-visual.cjs

      - name: Archive published overlap autozoom screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-preview-pin-overlap-v167
          path: preview-source/pin-overlap-artifacts/*.png
          if-no-files-found: ignore

      - name: Archive published Pin dialog screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-preview-pin-dialog-v167
          path: preview-source/pin-dialog-visual-artifacts/*.png
          if-no-files-found: ignore

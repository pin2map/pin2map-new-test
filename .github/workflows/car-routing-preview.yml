name: Modular auto route browser and live preview gate
on:
  push:
    branches: [feature/leaflet-modular-core]
    paths:
      - app.js
      - index.html
      - styles.css
      - sw.js
      - domain/active-car-route.js
      - application/car-route-session.js
      - application/route-guide-session.js
      - adapters/routing/car-routing-provider.js
      - ui/car-route-panel.js
      - ui/car-route-map-view.js
      - map-adapter-leaflet.js
      - tests/car-routing-browser.cjs
      - .github/workflows/car-routing-preview.yml
  pull_request:
    branches: [feature/leaflet-modular-core]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  car-routing-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned browser test tooling
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Run standalone local HTML server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/p2m-routing-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p2m-routing-server.log
          exit 1
      - name: REQUIRED actual Chromium and WebKit auto routing interactions
        env:
          PIN2MAP_ROUTING_URL: http://127.0.0.1:8765/
        run: node tests/car-routing-browser.cjs
      - name: REQUIRED verify deployed Preview assets and service worker byte-exact over HTTPS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, time, urllib.request
          assets=['index.html','app.js','styles.css','sw.js',
             'domain/active-car-route.js','application/routing-service.js',
             'adapters/routing/car-routing-provider.js','application/car-route-session.js',
             'application/route-guide-session.js','ui/car-route-map-view.js','ui/car-route-panel.js']
          assert 'pin2map-new-v331' in Path('sw.js').read_text()
          origin='https://pin2map.github.io/pin2map-new-test/preview/'
          expected={p:hashlib.sha256(Path(p).read_bytes()).digest() for p in assets}
          for attempt in range(30):
              try:
                  for path,digest in expected.items():
                      req=urllib.request.Request(origin+path+'?routing-v331-check=1',headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=25) as res: raw=res.read()
                      assert hashlib.sha256(raw).digest()==digest, f'Live asset differs: {path}'
                  print('PASS live HTTPS preview and SW v331 byte-identical to reviewed routing branch')
                  break
              except Exception as error:
                  print('Preview publication not finished:',error,flush=True)
                  if attempt==29: raise
                  time.sleep(8)
          PY
      - name: REQUIRED actual Chromium and WebKit auto routing interactions on HTTPS Preview
        env:
          PIN2MAP_ROUTING_URL: https://pin2map.github.io/pin2map-new-test/preview/
        run: node tests/car-routing-browser.cjs

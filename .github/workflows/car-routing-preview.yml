name: Modular auto route browser and live preview gate
on:
  push:
    branches: [feature/leaflet-modular-core]
    paths:
      - app.js
      - index.html
      - styles.css
      - sw.js
      - domain/active-car-route.js
      - domain/route-guide-corridor.js
      - ui/pin-marker-view.js
      - application/car-route-session.js
      - application/route-guide-session.js
      - adapters/routing/car-routing-provider.js
      - adapters/routing/bicycle-routing-provider.js
      - ui/car-route-panel.js
      - ui/car-route-map-view.js
      - map-adapter-leaflet.js
      - domain/transit-journey.js
      - application/transit-route-search.js
      - adapters/routing/transit-routing-provider.js
      - ui/transit-route-panel.js
      - tests/car-routing-browser.cjs
      - .github/workflows/car-routing-preview.yml
  pull_request:
    branches: [feature/leaflet-modular-core]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  car-routing-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned browser test tooling
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Run standalone local HTML server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/p2m-routing-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p2m-routing-server.log
          exit 1
      - name: REQUIRED actual Chromium and WebKit auto routing interactions
        env:
          PIN2MAP_ROUTING_URL: http://127.0.0.1:8765/
        run: node tests/car-routing-browser.cjs
      - name: REQUIRED verify deployed Preview assets and isolated service worker byte-exact over HTTPS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, time, urllib.request

          source_sw=Path('sw.js').read_text(encoding='utf-8')
          version=re.search(r"const CACHE='pin2map-new-v(\d+)'",source_sw)
          assert version, 'Cannot determine expected source worker release'
          release='pin2map-preview-v'+version.group(1)
          origin='https://pin2map.github.io/pin2map-new-test/preview/'
          assets=['app.js','styles.css','domain/active-car-route.js','domain/route-guide-corridor.js',
             'map-adapter-leaflet.js','ui/pin-marker-view.js',
             'application/routing-service.js','adapters/routing/car-routing-provider.js','adapters/routing/bicycle-routing-provider.js',
             'application/car-route-session.js','application/route-guide-session.js',
             'ui/car-route-map-view.js','ui/car-route-panel.js','domain/transit-journey.js',
             'application/transit-route-search.js','adapters/routing/transit-routing-provider.js','ui/transit-route-panel.js']
          expected={p:Path(p).read_bytes() for p in assets}

          # Pages publishes an ISOLATED Preview app rather than a raw source copy.
          # Recreate the exact release-keyed HTML and worker transformations
          # defined in preview-pages.yml; never compare to unisolated source bytes.
          cdn='https://unpkg.com/leaflet@1.9.4/dist/'
          html=Path('index.html').read_text(encoding='utf-8')
          for name in ('leaflet.css','leaflet.js'):
              html=html.replace(cdn+name,'./vendor/leaflet/'+name)
          old_title='<title>pin2map NEW · Testversion</title>'
          assert old_title in html
          html=html.replace(old_title,'<title>pin2map NEW · Entwicklungsvorschau</title>')
          html=re.sub(
              r'((?:src|href)="\./(?:vendor/leaflet/|domain/|application/|adapters/|ui/|map-adapter-leaflet\.js|app\.js|styles\.css)[^"?]*)(?=")',
              lambda match:match.group(1)+'?__p2m_release='+release,html)
          html=html.replace('</head>','<meta name="pin2map-preview-version" content="'+release+'">\n</head>')
          expected['index.html']=html.encode('utf-8')

          sw=source_sw
          for name in ('leaflet.css','leaflet.js'):
              sw=sw.replace(cdn+name,'./vendor/leaflet/'+name)
          sw=sw.replace('pin2map-new-v','pin2map-preview-v')
          sw=sw.replace("name.startsWith('pin2map-new-')","name.startsWith('pin2map-preview-')")
          sw=sw.replace('pin2map-viewed-osm-tiles-v1','pin2map-preview-viewed-osm-tiles-v1')
          sw=sw.replace('pin2map-viewed-osm-tile-metadata-v1','pin2map-preview-viewed-osm-tile-metadata-v1')
          assert "const CACHE='"+release+"'" in sw
          expected['sw.js']=sw.encode('utf-8')

          for attempt in range(30):
              try:
                  for path,source in expected.items():
                      req=urllib.request.Request(origin+path+'?routing-'+release+'-check=1',
                                                 headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=25) as res:
                          live=res.read()
                          assert res.status==200, f'HTTP {res.status}: {path}'
                      assert hashlib.sha256(live).digest()==hashlib.sha256(source).digest(), \
                          f'Live transformed asset differs: {path}'
                  req=urllib.request.Request(origin+'?routing-'+release+'-check=1',
                                             headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=25) as res:
                      assert res.read()==expected['index.html'], 'Preview / differs from index.html'
                  print('PASS byte-exact HTTPS Preview '+release+
                        ' (release-keyed index, routing modules, CSS, isolated SW)')
                  break
              except Exception as error:
                  print('Preview publication not finished:',error,flush=True)
                  if attempt==29: raise
                  time.sleep(8)
          PY
      - name: REQUIRED actual Chromium and WebKit auto routing interactions on HTTPS Preview
        env:
          PIN2MAP_ROUTING_URL: https://pin2map.github.io/pin2map-new-test/preview/
        run: node tests/car-routing-browser.cjs

      - name: Live Transitous browser sample on HTTPS Preview
        continue-on-error: true
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch();
            try{
              const page=await browser.newPage();
              await page.goto('https://pin2map.github.io/pin2map-new-test/preview/',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>!!window.Pin2MapTransitRoutingProvider);
              const outcome=await page.evaluate(async()=>{
                const provider=new window.Pin2MapTransitRoutingProvider({fetchImpl:window.fetch.bind(window)});
                const signal=AbortSignal.timeout(25000);
                const journeys=await provider.calculate({
                  waypoints:[{lat:52.525,lng:13.369},{lat:52.510,lng:13.398}],
                  query:{time:Date.now(),arriveBy:false,vehicle:'all'},signal
                });
                return {count:journeys.length,modes:[...new Set(journeys.flatMap(route=>route.legs.map(leg=>leg.mode)))]};
              });
              if(!outcome.count)throw new Error('Transitous returned no usable connection');
              console.log('PASS Transitous through the published browser adapter',JSON.stringify(outcome));
              const detail=await page.evaluate(async()=>{
                const signal=AbortSignal.timeout(35000);
                const provider=new window.Pin2MapTransitRoutingProvider({fetchImpl:window.fetch.bind(window)});
                const waypoints=[{lat:48.8401,lng:2.3797},{lat:48.8657,lng:2.3345}];
                const query={time:Date.parse("2026-11-26T05:14:00Z"),arriveBy:false,vehicle:"all",moreTransferTime:true};
                const routes=await provider.calculate({waypoints,query,signal});
                return {count:routes.length,modes:[...new Set(routes.flatMap(journey=>
                  journey.legs.filter(leg=>leg.mode!=="WALK").map(leg=>leg.mode+" "+(leg.line||"ohne Linienangabe"))))]};
              }).catch(error=>({status:error.message}));
              console.log('Paris Bercy to Pyramides with increased transfer time',JSON.stringify(detail));
            }finally{await browser.close();}
          })().catch(error=>{console.error(error);process.exitCode=1;});
          JS

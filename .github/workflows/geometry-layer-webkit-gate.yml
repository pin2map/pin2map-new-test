name: Safari/WebKit geometry layer regression (release blocker)
on:
  push:
    branches: [feature/leaflet-modular-core]
    paths:
      - 'tests/geometry-layer-webkit-regression.cjs'
      - '.github/workflows/geometry-layer-webkit-gate.yml'
      - 'ui/pin-layer-picker.js'
      - 'ui/geometry-editor.js'
      - 'styles.css'
      - 'sw.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safari-geometry:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaflet-modular-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright WebKit dependencies
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install webkit chromium
      # This independent push gate must test the committed candidate, not
      # the previously published Pages version (which may still be v254
      # when this workflow starts for a v255 commit).
      - name: Serve the exact candidate checkout
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/p2m-webkit-local.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/p2m-webkit-local.log
          exit 1
      - name: Mandatory candidate-dialog WebKit and Chromium regression
        env:
          PIN2MAP_TEST_URL: http://127.0.0.1:8765/
        run: node tests/geometry-layer-webkit-regression.cjs
      - name: Preserve actual screenshots (including failed regression)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-webkit-real-18-layer-dialog-evidence
          path: geometry-layer-regression-artifacts/*.png
          if-no-files-found: warn

name: Live NASA precipitation API diagnostic
on:
  push:
    branches: [feature/leaflet-modular-core]
    paths: ['adapters/weather/nasa-power-precipitation.js', '.github/workflows/nasa-precip-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe real NASA POWER climatology for Zugspitze (HY and AG)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.parse,urllib.request,urllib.error,json
          for community,param in (('HY','IMERG_PRECTOT'),('AG','IMERG_PRECTOT'),('AG','PRECTOTCORR'),('SB','PRECTOTCORR'),('RE','PRECTOTCORR')):
              query=urllib.parse.urlencode(dict(parameters=param,community=community,latitude=47.421,longitude=10.985,format="JSON"))
              url="https://power.larc.nasa.gov/api/temporal/climatology/point?"+query
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"pin2map-precip-diagnostic/1.0"}),timeout=32) as response:
                      body=response.read(200000).decode("utf-8","replace")
                      data=json.loads(body)
                      param=data.get("properties",{}).get("parameter",{}).get(param,{})
                      print("community",community,"parameter",param,"status",response.status,"firstMonths",str({k:param.get(k) for k in ("JAN","FEB","MAR")}),"keys",list(data.keys()),flush=True)
              except urllib.error.HTTPError as error:
                  print("community",community,"parameter",param,"HTTP",error.code,"response",error.read(1500).decode("utf-8","replace"),flush=True)
              except Exception as error:
                  print("community",community,"parameter",param,"error",str(error)[:1000],flush=True)
          PY

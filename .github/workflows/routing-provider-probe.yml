name: Routing provider feasibility probe (isolated)
on:
  push:
    branches: [feature/leaflet-modular-core]
    paths: [.github/workflows/routing-provider-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Live comparison with verified city addresses
        shell: bash
        run: |
          node <<'JS'
          const UA='pin2map-routing-feasibility-test/0.1 (https://github.com/pin2map/pin2map-new-test)';
          const fmt=n=>Math.round(n*10)/10;
          const fetchJson=async(url,label)=>{
            const response=await fetch(url,{headers:{'User-Agent':UA,'Accept':'application/json'},signal:AbortSignal.timeout(16000)});
            if(!response.ok) throw Error(label+': HTTP '+response.status);
            return response.json();
          };
          const normalize=s=>String(s??'').toLocaleLowerCase('de-DE').replaceAll('ß','ss').replace(/[^a-z0-9]/g,'');
          async function geocodeExact(query,road,number){
            const u=new URL('https://nominatim.openstreetmap.org/search');
            u.searchParams.set('q',query);u.searchParams.set('format','jsonv2');u.searchParams.set('addressdetails','1');u.searchParams.set('limit','5');
            const found=await fetchJson(u,'geocoder');
            const match=found.find(x=>normalize(x.address?.road)===normalize(road)&&normalize(x.address?.house_number)===normalize(number));
            if(!match)throw Error('ADDRESS NOT VERIFIED '+query+' results='+found.map(x=>x.display_name).join(' | ').slice(0,500));
            console.log('ADDRESS '+query+' => '+match.lat+','+match.lon+' '+match.display_name);
            return {lat:Number(match.lat),lon:Number(match.lon)};
          }
          async function compare(title,a,b){
            console.log('CASE '+title+' '+JSON.stringify({a,b}));
            for(const provider of ['OSRM','Valhalla']){
              try{
                let routes;
                if(provider==='OSRM'){
                  const url='https://router.project-osrm.org/route/v1/driving/'+a.lon+','+a.lat+';'+b.lon+','+b.lat+'?overview=false&steps=false&alternatives=true';
                  const data=await fetchJson(url,'OSRM');
                  if(data.code!=='Ok'||!data.routes?.length)throw Error('no routes '+data.code);
                  routes=data.routes.map(x=>({km:fmt(x.distance/1000),minutes:fmt(x.duration/60)}));
                }else{
                  const url=new URL('https://valhalla1.openstreetmap.de/route');
                  url.searchParams.set('json',JSON.stringify({locations:[a,b],costing:'auto',alternates:2,directions_type:'none',units:'kilometers'}));
                  const data=await fetchJson(url,'Valhalla');
                  if(!data.trip?.summary)throw Error('no trip '+JSON.stringify(data).slice(0,250));
                  routes=[data.trip,...(data.alternates??[]).map(x=>x.trip).filter(Boolean)].map(x=>({km:fmt(x.summary.length),minutes:fmt(x.summary.time/60)}));
                }
                console.log('RESULT '+provider+' '+title+' '+JSON.stringify(routes));
              }catch(error){console.error('FAIL '+provider+' '+title+' '+error.message);process.exitCode=1;}
            }
          }
          try {
            const start=await geocodeExact('Bodelschwinghstraße 64, Stuttgart, Deutschland','Bodelschwinghstraße','64');
            await new Promise(r=>setTimeout(r,1200));
            const target=await geocodeExact('Chamissostraße 21, Stuttgart, Deutschland','Chamissostraße','21');
            await compare('STUTTGART-INNER-CITY',start,target);
            await new Promise(r=>setTimeout(r,1200));
            const u=new URL('https://nominatim.openstreetmap.org/search');
            u.searchParams.set('q','Hamburg, Deutschland');u.searchParams.set('format','jsonv2');u.searchParams.set('limit','5');
            const city=await fetchJson(u,'Hamburg city center');
            const match=city.find(x=>x.type==='administrative'||x.type==='city');
            if(!match)throw Error('Hamburg center not verified');
            await compare('STUTTGART-TO-HAMBURG-CITY-CENTER (not exact destination)',target,{lat:Number(match.lat),lon:Number(match.lon)});
          }catch(error){console.error('BLOCKED '+error.message);process.exitCode=1;}
          JS
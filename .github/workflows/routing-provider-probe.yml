name: Routing provider feasibility probe (isolated)
on:
  push:
    branches: [feature/leaflet-modular-core]
    paths: [.github/workflows/routing-provider-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Live comparison city, Berlin examples, and city-to-rural address
        shell: bash
        run: |
          node <<'JS'
          const UA='pin2map-routing-feasibility-test/0.1 (https://github.com/pin2map/pin2map-new-test)';
          const fmt=n=>Math.round(n*10)/10;
          const fetchJson=async(url,label)=>{
            const response=await fetch(url,{headers:{'User-Agent':UA,'Accept':'application/json'},signal:AbortSignal.timeout(16000)});
            if(!response.ok) throw Error(label+': HTTP '+response.status);
            return response.json();
          };
          const normalize=s=>String(s??'').toLocaleLowerCase('de-DE').replaceAll('ß','ss').replace(/[^a-z0-9]/g,'');
          async function geocodeExact(query,road,number){
            const u=new URL('https://nominatim.openstreetmap.org/search');
            u.searchParams.set('q',query);u.searchParams.set('format','jsonv2');u.searchParams.set('addressdetails','1');u.searchParams.set('limit','5');
            const found=await fetchJson(u,'geocoder');
            const match=found.find(x=>normalize(x.address?.road)===normalize(road)&&normalize(x.address?.house_number)===normalize(number));
            if(!match)throw Error('ADDRESS NOT VERIFIED '+query+' results='+found.map(x=>x.display_name).join(' | ').slice(0,500));
            console.log('ADDRESS '+query+' => '+match.lat+','+match.lon+' '+match.display_name);
            return {lat:Number(match.lat),lon:Number(match.lon)};
          }
          async function compare(title,a,b){
            console.log('CASE '+title+' '+JSON.stringify({a,b}));
            for(const provider of ['OSRM','Valhalla']){
              try{
                let routes;
                if(provider==='OSRM'){
                  const url='https://router.project-osrm.org/route/v1/driving/'+a.lon+','+a.lat+';'+b.lon+','+b.lat+'?overview=false&steps=false&alternatives=true';
                  const data=await fetchJson(url,'OSRM');
                  if(data.code!=='Ok'||!data.routes?.length)throw Error('no routes '+data.code);
                  routes=data.routes.map(x=>({km:fmt(x.distance/1000),minutes:fmt(x.duration/60)}));
                }else{
                  const url=new URL('https://valhalla1.openstreetmap.de/route');
                  url.searchParams.set('json',JSON.stringify({locations:[a,b],costing:'auto',alternates:2,directions_type:'none',units:'kilometers'}));
                  const data=await fetchJson(url,'Valhalla');
                  if(!data.trip?.summary)throw Error('no trip '+JSON.stringify(data).slice(0,250));
                  routes=[data.trip,...(data.alternates??[]).map(x=>x.trip).filter(Boolean)].map(x=>({km:fmt(x.summary.length),minutes:fmt(x.summary.time/60)}));
                }
                console.log('RESULT '+provider+' '+title+' '+JSON.stringify(routes));
              }catch(error){console.error('FAIL '+provider+' '+title+' '+error.message);process.exitCode=1;}
            }
          }
          try {
            const start=await geocodeExact('Bodelschwinghstraße 64, Stuttgart, Deutschland','Bodelschwinghstraße','64');
            await new Promise(r=>setTimeout(r,1200));
            const target=await geocodeExact('Chamissostraße 21, Stuttgart, Deutschland','Chamissostraße','21');
            await compare('STUTTGART-INNER-CITY',start,target);
            await new Promise(r=>setTimeout(r,1200));
            const u=new URL('https://nominatim.openstreetmap.org/search');
            u.searchParams.set('q','Hamburg, Deutschland');u.searchParams.set('format','jsonv2');u.searchParams.set('limit','5');
            const city=await fetchJson(u,'Hamburg city center');
            const match=city.find(x=>x.type==='administrative'||x.type==='city');
            if(!match)throw Error('Hamburg center not verified');
            await compare('STUTTGART-TO-HAMBURG-CITY-CENTER (not exact destination)',target,{lat:Number(match.lat),lon:Number(match.lon)});
            await new Promise(r=>setTimeout(r,1200));
            const rural=await geocodeExact('Hölderlinstraße 12, Groß Lafferde, Deutschland','Hölderlinstraße','12');
            await compare('STUTTGART-TO-GROSS-LAFFERDE',start,rural);
            // Three OSRM API documentation coordinates in Berlin. Separate legs ensure
            // both engines receive identical two-point requests, not inferred routes.
            const berlin1={lat:52.517037,lon:13.388860};
            const berlin2={lat:52.529407,lon:13.397634};
            const berlin3={lat:52.523219,lon:13.428555};
            await compare('BERLIN-OSRM-EXAMPLE-1-TO-2',berlin1,berlin2);
            await compare('BERLIN-OSRM-EXAMPLE-2-TO-3',berlin2,berlin3);
          }catch(error){console.error('BLOCKED '+error.message);process.exitCode=1;}
          JS

      - name: Inspect named streets and routing model speeds (four comparison routes)
        shell: bash
        run: |
          node <<'JS'
          const UA='pin2map-routing-feasibility-test/0.2 (https://github.com/pin2map/pin2map-new-test)';
          const cases=[
            ['STUTTGART-INNER-CITY',[48.7452823,9.1604151],[48.7753859,9.1412686]],
            ['STUTTGART-TO-GROSS-LAFFERDE',[48.7452823,9.1604151],[52.2308763,10.2462993]],
            ['BERLIN-OSRM-EXAMPLE-1-TO-2',[52.517037,13.388860],[52.529407,13.397634]],
            ['BERLIN-OSRM-EXAMPLE-2-TO-3',[52.529407,13.397634],[52.523219,13.428555]]
          ];
          const rnd=(n,d=1)=>Number(Number(n).toFixed(d));
          const speed=(m,t)=>t>0?m*3.6/t:0;
          async function request(u,opt={}){
            const r=await fetch(u,{...opt,headers:{'User-Agent':UA,Accept:'application/json',...(opt.headers||{})},signal:AbortSignal.timeout(25000)});
            if(!r.ok)throw Error('HTTP '+r.status+' '+(await r.text()).slice(0,250));
            return r.json();
          }
          function roads(items,valhalla=false){
            const m=new Map(),ordered=[];
            for(const s of items){
              const name=String(valhalla?(s.street_names?.join('/')||'(unnamed)'):(s.name||'(unnamed)'));
              const meters=valhalla?(s.length||0)*1000:(s.distance||0);
              const seconds=valhalla?(s.time||0):(s.duration||0);
              if(meters<5)continue;
              if(ordered.at(-1)!==name)ordered.push(name);
              const x=m.get(name)||{name,meters:0,seconds:0};
              x.meters+=meters;x.seconds+=seconds;m.set(name,x);
            }
            return {ordered:ordered.slice(0,24),longest:[...m.values()].sort((a,b)=>b.meters-a.meters).slice(0,12).map(x=>({name:x.name,km:rnd(x.meters/1000,2),min:rnd(x.seconds/60,2),computedKmh:rnd(speed(x.meters,x.seconds))}))};
          }
          function speeds(annotation){
            if(!annotation?.distance?.length||!annotation.duration)return {unavailable:true};
            const buckets={'<20':0,'20-39':0,'40-59':0,'60-89':0,'90-119':0,'120+':0};
            let metres=0,seconds=0;
            annotation.distance.forEach((d,i)=>{
              const t=annotation.duration[i];
              if(!(d>0&&t>0))return;
              const v=speed(d,t),key=v<20?'<20':v<40?'20-39':v<60?'40-59':v<90?'60-89':v<120?'90-119':'120+';
              buckets[key]+=d;metres+=d;seconds+=t;
            });
            return {segments:annotation.distance.length,km:rnd(metres/1000,2),modelAverageKmh:rnd(speed(metres,seconds)),kmByModelSpeed:Object.fromEntries(Object.entries(buckets).map(([k,v])=>[k,rnd(v/1000,2)])),sources:annotation.datasource_names||[]};
          }
          let failures=0;
          for(const [label,a,b] of cases){
            try{
              const u='https://router.project-osrm.org/route/v1/driving/'+a[1]+','+a[0]+';'+b[1]+','+b[0]+'?alternatives=false&steps=true&annotations=distance,duration,speed,datasources&overview=false';
              const d=await request(u);
              if(d.code!=='Ok'||!d.routes?.length)throw Error('route unavailable');
              const x=d.routes[0];
              console.log('STREET_OSRM',label,JSON.stringify({km:rnd(x.distance/1000,2),minutes:rnd(x.duration/60,2),streets:roads(x.legs.flatMap(l=>l.steps||[])),speedModels:x.legs.map(l=>speeds(l.annotation)),caution:'annotation speeds are distance/duration model speeds, not legal speed limits; turns may affect maneuver durations'}));
            }catch(e){failures++;console.error('STREET_FAIL_OSRM',label,e.message);}
            try{
              const u=new URL('https://valhalla1.openstreetmap.de/route');
              u.searchParams.set('json',JSON.stringify({locations:[{lat:a[0],lon:a[1]},{lat:b[0],lon:b[1]}],costing:'auto',alternates:0,units:'kilometers',directions_type:'instructions'}));
              const d=await request(u);
              if(!d.trip?.summary||!d.trip.legs?.length)throw Error('trip unavailable');
              const trip=d.trip,legs=trip.legs;
              console.log('STREET_VALHALLA',label,JSON.stringify({km:rnd(trip.summary.length,2),minutes:rnd(trip.summary.time/60,2),streets:roads(legs.flatMap(l=>l.maneuvers||[]),true),caution:'maneuver speeds are inferred from length/time and not legal speed limits'}));
              if(label==='STUTTGART-INNER-CITY'||label.startsWith('BERLIN')){
                try{
                  const body={encoded_polyline:legs[0].shape,shape_match:'edge_walk',costing:'auto',filters:{action:'include',attributes:['edge.names','edge.length','edge.speed','edge.speed_limit','edge.road_class','edge.begin_shape_index','edge.end_shape_index','shape_attributes.speed_limit']}};
                  const trace=await request('https://valhalla1.openstreetmap.de/trace_attributes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
                  const edges=trace.edges||[];
                  console.log('EDGE_VALHALLA',label,JSON.stringify({edgeCount:edges.length,modelSpeedCount:edges.filter(x=>typeof x.speed==='number').length,postedLimitCount:edges.filter(x=>typeof x.speed_limit==='number'&&x.speed_limit>0).length,first:edges.slice(0,12).map(x=>({name:x.names,km:x.length,speed:x.speed,speedLimit:x.speed_limit,roadClass:x.road_class}))}));
                }catch(e){console.log('EDGE_VALHALLA_NOT_AVAILABLE',label,e.message.slice(0,250));}
              }
            }catch(e){failures++;console.error('STREET_FAIL_VALHALLA',label,e.message);}
          }
          if(failures){console.error('STREET_PROBE_FAILED',failures);process.exitCode=1;}
          JS

      - name: Test slow-vehicle speed cap without changing PWA
        shell: bash
        run: |
          node <<'JS'
          const cases=[
            ['STUTTGART-INNER-CITY',[48.7452823,9.1604151],[48.7753859,9.1412686]],
            ['STUTTGART-TO-GROSS-LAFFERDE',[48.7452823,9.1604151],[52.2308763,10.2462993]],
            ['BERLIN-EXAMPLE-1-TO-2',[52.517037,13.388860],[52.529407,13.397634]]
          ];
          const round=x=>Math.round(x*100)/100;
          let failed=0;
          for(const [name,from,to] of cases){
            try{
              for(const cap of [140,90]){
                const query=new URL('https://valhalla1.openstreetmap.de/route');
                query.searchParams.set('json',JSON.stringify({locations:[{lat:from[0],lon:from[1]},{lat:to[0],lon:to[1]}],costing:'auto',costing_options:{auto:{top_speed:cap}},units:'kilometers',directions_type:'none'}));
                const response=await fetch(query,{headers:{'User-Agent':'pin2map-routing-feasibility-test/0.3 (https://github.com/pin2map/pin2map-new-test)','Accept':'application/json'},signal:AbortSignal.timeout(25000)});
                if(!response.ok)throw Error('Valhalla HTTP '+response.status+' cap '+cap+': '+(await response.text()).slice(0,180));
                const data=await response.json();
                if(!data.trip?.summary)throw Error('Valhalla response missing trip cap '+cap);
                console.log('SPEED_CAP_VALHALLA '+name+' '+JSON.stringify({topSpeedKmh:cap,distanceKm:round(data.trip.summary.length),minutes:round(data.trip.summary.time/60)}));
              }
            }catch(error){console.error('SPEED_CAP_FAIL '+name+' '+error.message);failed++;}
          }
          if(failed)process.exitCode=1;
          JS

      - name: Benchmark OSRM and Valhalla request latency
        shell: bash
        run: |
          node <<'JS'
          // Public demo hosts: indicative network measurements only, not production SLA.
          const tests=[
            ['STUTTGART-CITY',[48.7452823,9.1604151],[48.7753859,9.1412686]],
            ['BERLIN-CITY',[52.517037,13.388860],[52.529407,13.397634]],
            ['STUTTGART-GROSS-LAFFERDE',[48.7452823,9.1604151],[52.2308763,10.2462993]],
            ['STUTTGART-HAMBURG',[48.7753859,9.1412686],[53.5501721,10.0013165]]
          ];
          const fmt=n=>Math.round(n*10)/10;
          const result=[],failures=[];
          async function timed(service,name,a,b,mode){
            const opts={headers:{'User-Agent':'pin2map-routing-feasibility-test/0.4 (https://github.com/pin2map/pin2map-new-test)',Accept:'application/json'},signal:AbortSignal.timeout(20000)};
            let url;
            if(service==='OSRM'){
              url='https://router.project-osrm.org/route/v1/driving/'+a[1]+','+a[0]+';'+b[1]+','+b[0]+'?alternatives=false&steps='+(mode==='detail'?'true':'false')+'&overview=false';
              if(mode==='detail')url+='&annotations=distance,duration,speed';
            }else{
              const u=new URL('https://valhalla1.openstreetmap.de/route');
              u.searchParams.set('json',JSON.stringify({locations:[{lat:a[0],lon:a[1]},{lat:b[0],lon:b[1]}],costing:'auto',units:'kilometers',directions_type:mode==='detail'?'instructions':'none'}));
              url=u.toString();
            }
            const started=performance.now();
            const response=await fetch(url,opts);
            const body=await response.text();
            const ms=fmt(performance.now()-started);
            if(!response.ok)throw Error(service+' HTTP '+response.status);
            const json=JSON.parse(body);
            if(service==='OSRM'?(json.code!=='Ok'||!json.routes?.length):!json.trip?.summary)throw Error(service+' invalid routing response');
            return {ms,bytes:Buffer.byteLength(body)};
          }
          // Alternate order across samples to reduce warmed-connection/order bias.
          for(const [name,a,b] of tests){
            for(let repeat=0;repeat<4;repeat++){
              const services=repeat%2===0?['OSRM','Valhalla']:['Valhalla','OSRM'];
              for(const service of services){
                try{
                  const value=await timed(service,name,a,b,'basic');
                  result.push({name,service,repeat,mode:'basic',...value});
                  console.log('LATENCY_SAMPLE '+JSON.stringify(result.at(-1)));
                }catch(e){failures.push({name,service,repeat,error:e.message});console.error('LATENCY_FAIL '+JSON.stringify(failures.at(-1)));}
              }
            }
            // Detail responses on the short urban routes versus basic overhead.
            if(name.includes('CITY')){
              for(const service of ['OSRM','Valhalla']){
                try{
                  const value=await timed(service,name,a,b,'detail');
                  result.push({name,service,repeat:0,mode:'detail',...value});
                  console.log('LATENCY_SAMPLE '+JSON.stringify(result.at(-1)));
                }catch(e){failures.push({name,service,mode:'detail',error:e.message});console.error('LATENCY_FAIL '+JSON.stringify(failures.at(-1)));}
              }
            }
          }
          const median=a=>{const v=[...a].sort((a,b)=>a-b);return(v[Math.floor((v.length-1)/2)]+v[Math.floor(v.length/2)])/2;};
          for(const [name] of tests){
            for(const service of ['OSRM','Valhalla']){
              const rows=result.filter(x=>x.name===name&&x.service===service&&x.mode==='basic');
              if(!rows.length)continue;
              const ms=rows.map(x=>x.ms);
              console.log('LATENCY_SUMMARY '+JSON.stringify({name,service,count:ms.length,medianMs:fmt(median(ms)),minMs:fmt(Math.min(...ms)),maxMs:fmt(Math.max(...ms)),meanMs:fmt(ms.reduce((a,b)=>a+b,0)/ms.length),responseBytesMedian:Math.round(median(rows.map(x=>x.bytes)))}));
            }
          }
          console.log('LATENCY_TEST_INFO '+JSON.stringify({total:result.length,failures:failures.length,location:'GitHub Actions hosted runner, not Stuttgart or end-user browser',notes:'Small sample, public demo servers; compare results cautiously, additional trace calls not included in basic timing'}));
          if(failures.length)process.exitCode=1;
          JS

      - name: Benchmark drawable route geometry delivery
        shell: bash
        run: |
          node <<'JS'
          const routes=[
            ['STUTTGART-CITY',[48.7452823,9.1604151],[48.7753859,9.1412686]],
            ['BERLIN-CITY',[52.517037,13.388860],[52.529407,13.397634]],
            ['STUTTGART-GROSS-LAFFERDE',[48.7452823,9.1604151],[52.2308763,10.2462993]],
            ['STUTTGART-HAMBURG',[48.7753859,9.1412686],[53.5501721,10.0013165]]
          ];
          const samples=[],failures=[];
          const round=n=>Math.round(n*10)/10;
          for(const [name,a,b] of routes){
            for(let i=0;i<3;i++){
              for(const service of (i%2===0?['Valhalla','OSRM']:['OSRM','Valhalla'])){
                try{
                  let url;
                  if(service==='OSRM'){
                    url='https://router.project-osrm.org/route/v1/driving/'+a[1]+','+a[0]+';'+b[1]+','+b[0]+'?alternatives=false&steps=false&overview=full&geometries=polyline';
                  }else{
                    const u=new URL('https://valhalla1.openstreetmap.de/route');
                    u.searchParams.set('json',JSON.stringify({locations:[{lat:a[0],lon:a[1]},{lat:b[0],lon:b[1]}],costing:'auto',directions_type:'none',units:'kilometers'}));
                    url=u.toString();
                  }
                  const start=performance.now();
                  const response=await fetch(url,{headers:{'User-Agent':'pin2map-routing-feasibility-test/0.5 (https://github.com/pin2map/pin2map-new-test)',Accept:'application/json'},signal:AbortSignal.timeout(20000)});
                  const raw=await response.text(),ms=round(performance.now()-start);
                  if(!response.ok)throw Error('HTTP '+response.status);
                  const json=JSON.parse(raw);
                  const geometry=service==='OSRM'?json.routes?.[0]?.geometry:json.trip?.legs?.[0]?.shape;
                  if(typeof geometry!=='string'||geometry.length<5)throw Error('missing drawable geometry');
                  const result={name,service,repeat:i,ms,bytes:Buffer.byteLength(raw),geometryChars:geometry.length};
                  samples.push(result);console.log('GEOMETRY_LATENCY_SAMPLE '+JSON.stringify(result));
                }catch(e){failures.push({name,service,error:e.message});console.error('GEOMETRY_LATENCY_FAIL '+JSON.stringify(failures.at(-1)));}
              }
            }
          }
          for(const [name] of routes){
            for(const service of ['OSRM','Valhalla']){
              const values=samples.filter(x=>x.name===name&&x.service===service).sort((a,b)=>a.ms-b.ms);
              if(!values.length)continue;
              const m=values[Math.floor(values.length/2)];
              console.log('GEOMETRY_LATENCY_SUMMARY '+JSON.stringify({name,service,count:values.length,medianMs:m.ms,medianBytes:m.bytes,medianGeometryChars:m.geometryChars,minMs:values[0].ms,maxMs:values.at(-1).ms}));
            }
          }
          console.log('GEOMETRY_LATENCY_INFO '+JSON.stringify({successful:samples.length,failed:failures.length,note:'Both carry full drawable polyline; remaining payload shapes/hosting/network remain provider dependent'}));
          if(failures.length)process.exitCode=1;
          JS

      - name: Full slow vehicle pipeline and per-road-category time trial
        shell: bash
        run: |
          node <<'JS'
          const routes=[
            ['STUTTGART-CITY',[48.7452823,9.1604151],[48.7753859,9.1412686]],
            ['BERLIN-CITY',[52.517037,13.388860],[52.529407,13.397634]],
            ['STUTTGART-GROSS-LAFFERDE',[48.7452823,9.1604151],[52.2308763,10.2462993]]
          ];
          // Deliberately illustrative, NOT approved real vehicle or legal road profile.
          const limits={motorway:90,rural:70,urban:35,unpaved:25};
          const fmt=x=>Math.round(x*10)/10;
          const UA='pin2map-routing-feasibility-test/0.6 (https://github.com/pin2map/pin2map-new-test)';
          const fetchData=async(url,opt={})=>{
            const response=await fetch(url,{...opt,headers:{'User-Agent':UA,Accept:'application/json',...(opt.headers||{})},signal:AbortSignal.timeout(35000)});
            const text=await response.text();
            if(!response.ok)throw Error('HTTP '+response.status+' '+text.slice(0,220));
            return JSON.parse(text);
          };
          const classify=edge=>{
            const c=String(edge.road_class||'').toLowerCase();
            const use=String(edge.use||'').toLowerCase();
            const surface=String(edge.surface||'').toLowerCase();
            if(/unpaved|gravel|dirt|ground|compacted/.test(surface))return 'unpaved';
            if(/motorway|trunk/.test(c)||use==='ramp')return 'motorway';
            if(/residential|service|living_street/.test(c)||/residential|living_street/.test(use))return 'urban';
            if(/primary|secondary|tertiary|unclassified/.test(c))return 'rural';
            return 'urban';
          };
          const summarise=edges=>{
            let metres=0,sec=0,unknown=0,counts={motorway:0,rural:0,urban:0,unpaved:0};
            let capped=0,legal=0;
            for(const e of edges){
              const km=Number(e.length),model=Number(e.speed),posted=Number(e.speed_limit);
              if(!(km>0&&model>0)){unknown++;continue;}
              const type=classify(e);
              let chosen=Math.min(model,limits[type]);
              if(posted>0)chosen=Math.min(chosen,posted);
              if(chosen<model)capped++;
              if(posted>0)legal++;
              const kmActual=km;metres+=kmActual;counts[type]+=kmActual;
              sec+=3600*kmActual/chosen;
            }
            return {km:fmt(metres),minutes:fmt(sec/60),edgeCount:edges.length,validLimitEdges:legal,unknownEdges:unknown,cappedEdges:capped,classKm:Object.fromEntries(Object.entries(counts).map(([k,v])=>[k,fmt(v)])),note:'Naive sum of edge length/min(model, illustrative cap, posted limit); excludes turns, congestion and calibrations'};
          };
          // The public Valhalla map_snap endpoint rejects paths over 200 km.
          // Split only the *analysis* geometry, never the underlying OSRM route.
          const decode6=str=>{
            const pts=[];let at=0,lat=0,lon=0;
            while(at<str.length){
              const read=()=>{let b=0,result=0,shift=0;do{if(at>=str.length)throw Error('invalid polyline');b=str.charCodeAt(at++)-63;result|=(b&31)<<shift;shift+=5;}while(b>=32);return result&1?~(result>>1):(result>>1);};
              lat+=read();lon+=read();pts.push([lat/1e6,lon/1e6]);
            }
            return pts;
          };
          const encode6=pts=>{
            let output='',lat=0,lon=0;
            const add=n=>{let v=n<0?~(n<<1):(n<<1);while(v>=32){output+=String.fromCharCode((32|(v&31))+63);v>>=5;}output+=String.fromCharCode(v+63);};
            for(const [a,b] of pts){const x=Math.round(a*1e6),y=Math.round(b*1e6);add(x-lat);add(y-lon);lat=x;lon=y;}
            return output;
          };
          const segmentKm=(a,b)=>{
            const r=Math.PI/180,p1=a[0]*r,p2=b[0]*r,dp=(b[0]-a[0])*r,dl=(b[1]-a[1])*r;
            const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
            return 12742*Math.asin(Math.min(1,Math.sqrt(h)));
          };
          const splitPath=shape=>{
            const pts=decode6(shape),parts=[];
            let current=[pts[0]],km=0;
            for(let i=1;i<pts.length;i++){
              const add=segmentKm(pts[i-1],pts[i]);km+=add;current.push(pts[i]);
              if(km>=100&&i<pts.length-1){
                parts.push(current);current=[pts[i]];km=0;
              }
            }
            if(current.length>1)parts.push(current);
            return parts.map(part=>{
              if(part.length<=750)return encode6(part);
              // Each subsample includes both endpoints; report fidelity separately.
              const stride=Math.ceil((part.length-1)/749),reduced=part.filter((_,i)=>i%stride===0||i===part.length-1);
              return encode6(reduced);
            });
          };
          const traceEdges=async(shape,shapeMatch)=>{
            const parts=shapeMatch==='map_snap'&&decode6(shape).length>2?splitPath(shape):[shape];
            const all=[];
            for(const polyline of parts){
              const body={encoded_polyline:polyline,shape_match:shapeMatch,costing:'auto',filters:{action:'include',attributes:['edge.length','edge.speed','edge.speed_limit','edge.road_class','edge.surface','edge.use']}};
              const result=await fetchData('https://valhalla1.openstreetmap.de/trace_attributes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
              if(!result.edges?.length)throw Error('no trace edges for part');
              all.push(...result.edges);
            }
            return {edges:all,traceRequests:parts.length};
          };
          const samples=[],failures=[];
          for(const [name,a,b] of routes){
            for(const provider of ['OSRM+VALHALLA_TRACE','VALHALLA_TOP_SPEED_90']){
              try{
                const begin=performance.now();
                let routeKm,routeMin,shape,stage1Ms,shapeMatch,source;
                if(provider==='OSRM+VALHALLA_TRACE'){
                  const url='https://router.project-osrm.org/route/v1/driving/'+a[1]+','+a[0]+';'+b[1]+','+b[0]+'?overview=full&geometries=polyline6&alternatives=false&steps=false';
                  const d=await fetchData(url);
                  if(d.code!=='Ok'||!d.routes?.[0]?.geometry)throw Error('OSRM has no polyline');
                  routeKm=d.routes[0].distance/1000;routeMin=d.routes[0].duration/60;
                  shape=d.routes[0].geometry;
                  shapeMatch='map_snap';
                  // OSRM is requesting polyline6; Valhalla also uses polyline6.
                  source='OSRM polyline6 → Valhalla map_snap (might not preserve same route)';
                }else{
                  const u=new URL('https://valhalla1.openstreetmap.de/route');
                  u.searchParams.set('json',JSON.stringify({locations:[{lat:a[0],lon:a[1]},{lat:b[0],lon:b[1]}],costing:'auto',costing_options:{auto:{top_speed:90}},units:'kilometers',directions_type:'none'}));
                  const d=await fetchData(u);
                  if(!d.trip?.legs?.length)throw Error('Valhalla has no route shape');
                  routeKm=d.trip.summary.length;routeMin=d.trip.summary.time/60;
                  shape=d.trip.legs[0].shape;shapeMatch='edge_walk';source='Valhalla 90 km/h route edge_walk';
                }
                stage1Ms=fmt(performance.now()-begin);
                const detail=await traceEdges(shape,shapeMatch);
                const edges=detail.edges;
                const stat=summarise(edges);
                const geometryDiscrepancy=fmt(Math.abs(stat.km-routeKm)/routeKm*100);
                const totalMs=fmt(performance.now()-begin);
                const result={name,provider,source,routeKm:fmt(routeKm),routeMin:fmt(routeMin),firstStageMs:stage1Ms,traceRequests:detail.traceRequests,traceStageMs:fmt(totalMs-stage1Ms),totalMs,geometryDiscrepancyPct:geometryDiscrepancy,illustrativeVehicle:limits,estimate:stat};
                console.log('VEHICLE_PIPELINE '+JSON.stringify(result));samples.push(result);
                if(geometryDiscrepancy>6)console.log('VEHICLE_TRACE_MISMATCH '+JSON.stringify({name,provider,geometryDiscrepancyPct:geometryDiscrepancy,note:'Reject as faithful edge match; do not use to rank providers'}));
              }catch(e){
                console.error('VEHICLE_PIPELINE_FAIL '+JSON.stringify({name,provider,error:e.message}));
                failures.push({name,provider,error:e.message});
              }
            }
          }
          console.log('VEHICLE_PIPELINE_INFO '+JSON.stringify({success:samples.length,failed:failures.length,profileStatus:'illustrative only, not authorized product configuration',limitation:'No reliable turn delays, trace validation, actual traffic, full road-type mapping, or production SLA. Valhalla map_snap may need multiple public demo trace requests per long OSRM route; network and snap fidelity not guaranteed.'}));
          if(failures.length)process.exitCode=1;
          JS

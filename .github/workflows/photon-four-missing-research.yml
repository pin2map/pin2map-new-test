name: Research missing Photon areas via names and OSM polygon containment
on:
  push:
    branches: [feature/leaflet-modular-core]
    paths: ['.github/workflows/photon-four-missing-research.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaflet-modular-core
          persist-credentials: true
      - name: Prepare real Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || true)
          test -n "$CHROME"
          echo "PIN2MAP_CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
      - name: Search names and alternative names then verify polygon containment
        run: |
          node <<'NODE'
          "use strict";
          (async()=>{
            const fs=require('node:fs'),{chromium}=require('playwright');
            const fixtures=require('./tests/area-source-fixtures.cjs');
            const targets=[
              {name:'Lake Kivu',terms:['Lake Kivu','Lac Kivu','Kivu Lake']},
              {name:'Namib Naukluft National Park',terms:['Namib-Naukluft National Park','Namib-Naukluft Park','Namib Naukluft']},
              {name:'Parque Nacional Torres del Paine',terms:['Torres del Paine National Park','Parque Nacional Torres del Paine','Torres del Paine']},
              {name:'Delamere Range Facility Training Area',terms:['Delamere Range Facility','Delamere Range','Delamere Training Area']}
            ].map(t=>({...t,point:fixtures.find(p=>p.name===t.name)}));
            const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
            const normalize=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
            const request=async(url,headers={})=>{
              const c=new AbortController(),timer=setTimeout(()=>c.abort(),22000),start=Date.now();
              try{const res=await fetch(url,{signal:c.signal,headers:{'User-Agent':'pin2map-research/1.0 (https://github.com/pin2map/pin2map-new-test)',...headers}});
                if(!res.ok)throw Error('HTTP '+res.status);
                return {status:'ok',ms:Date.now()-start,data:await res.json()}
              }catch(e){return {status:'failed',ms:Date.now()-start,error:String(e).slice(0,150)}}
              finally{clearTimeout(timer)}
            };
            const records=[];
            for(const t of targets){
              const photon=[];
              for(const q of t.terms){
                await wait(1400);
                const url=new URL('https://photon.komoot.io/api');
                url.searchParams.set('q',q);url.searchParams.set('limit','8');
                url.searchParams.set('lat',t.point.lat);url.searchParams.set('lon',t.point.lng);
                url.searchParams.set('lang','en');
                const response=await request(url);
                const results=(response.data?.features||[]).map(f=>({
                  id:f.properties?.osm_type&&f.properties?.osm_id?String(f.properties.osm_type).toUpperCase()+f.properties.osm_id:null,
                  name:f.properties?.name||null,key:f.properties?.osm_key||null,
                  value:f.properties?.osm_value||null,
                  point:f.geometry?.coordinates||null
                })).filter(x=>x.id&&/^[WR]\d+$/.test(x.id));
                photon.push({q,status:response.status,error:response.error,ms:response.ms,results});
              }
              records.push({name:t.name,region:t.point.region,lat:t.point.lat,lon:t.point.lng,photon});
            }
            const browser=await chromium.launch({headless:true,
              executablePath:process.env.PIN2MAP_CHROMIUM_EXECUTABLE,args:['--no-sandbox']});
            let evaluated;
            try{
              const page=await browser.newPage();
              await page.goto('https://pin2map.github.io/pin2map-new-test/preview/',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForFunction(()=>!!window.Pin2MapAreaGeometry?.containsPoint);
              evaluated=await page.evaluate(async records=>{
                const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
                const out=[];
                const clean=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
                for(const record of records){
                  const osmOptions=new Map();
                  for(const query of record.photon){
                    for(const x of query.results){
                      const relevant=clean(x.name).split(' ').some(w=>w.length>3&&clean(record.name).includes(w));
                      if(relevant&&!osmOptions.has(x.id))osmOptions.set(x.id,{...x,source:'photon',term:query.q});
                    }
                  }
                  // Independent targeted Nominatim name search, at most one request per area.
                  await wait(1450);
                  const url=new URL('https://nominatim.openstreetmap.org/search');
                  url.searchParams.set('q',record.name);
                  url.searchParams.set('format','json');url.searchParams.set('limit','7');
                  const found={status:'failed'};
                  try{
                    const c=new AbortController(),timer=setTimeout(()=>c.abort(),25000);
                    try{const res=await fetch(url,{signal:c.signal});
                      if(!res.ok)throw Error('HTTP '+res.status);
                      const hits=await res.json();
                      found.status='ok';
                      found.items=hits.map(x=>({id:(x.osm_type||'')[0]?.toUpperCase()+x.osm_id,
                        name:x.display_name?.split(',')[0]||null,type:x.type||null})).slice(0,7);
                      for(const x of found.items){
                        if(/^[WR]\d+$/.test(x.id)&&!osmOptions.has(x.id))osmOptions.set(x.id,{...x,source:'nominatim_search'});
                      }
                    }finally{clearTimeout(timer)}
                  }catch(e){found.error=String(e).slice(0,150)}
                  const options=[...osmOptions.values()].slice(0,5),lookups=[];
                  for(const option of options){
                    await wait(1450);
                    const u=new URL('https://nominatim.openstreetmap.org/lookup');
                    u.searchParams.set('osm_ids',option.id);
                    u.searchParams.set('format','json');u.searchParams.set('polygon_geojson','1');
                    const start=Date.now(),c=new AbortController(),timer=setTimeout(()=>c.abort(),26000);
                    try{
                      const res=await fetch(u,{signal:c.signal});
                      if(!res.ok)throw Error('HTTP '+res.status);
                      const body=await res.json(),data=body.find(x=>(x.osm_type||'')[0]?.toUpperCase()+x.osm_id===option.id);
                      const geom=data?.geojson,type=geom?.type||null;
                      const contains=['Polygon','MultiPolygon'].includes(type)?window.Pin2MapAreaGeometry.containsPoint(geom,record.lon,record.lat):false;
                      lookups.push({id:option.id,name:option.name,source:option.source,
                        resolvedName:data?.name||data?.display_name?.split(',')[0]||null,status:'ok',
                        geometryType:type,containsPoint:contains,
                        vertices:geom?window.Pin2MapAreaGeometry.pointCount(geom):0,ms:Date.now()-start});
                    }catch(e){lookups.push({id:option.id,name:option.name,source:option.source,status:'failed',
                      ms:Date.now()-start,error:String(e).slice(0,180)})}
                    finally{clearTimeout(timer)}
                  }
                  const recordOutput={name:record.name,region:record.region,
                    photon:record.photon.map(q=>({...q,results:q.results.slice(0,5)})),
                    nominatimSearch:found,candidateIds:options.map(x=>x.id),lookups,
                    confirmed:lookups.filter(x=>x.containsPoint).map(x=>({id:x.id,name:x.resolvedName}))};
                  out.push(recordOutput);
                  console.log('MISSING_AREA',JSON.stringify(recordOutput));
                }
                return out;
              },records);
            }finally{await browser.close()}
            const summary={tested:targets.length,photonResults:records.filter(r=>r.photon.some(q=>q.results.length)).length,
              pointContaining:evaluated.filter(r=>r.confirmed.length).length,
              missing:evaluated.filter(r=>!r.confirmed.length).map(r=>r.name)};
            console.log('MISSING_AREA_SUMMARY',JSON.stringify(summary));
            fs.writeFileSync('missing-area-research.json',JSON.stringify({testedAt:new Date().toISOString(),
              summary,evaluated,note:'Research metadata only; no polygon data retained. Name candidates do not imply same region unless original point contained.'},null,2)+'\n');
          })().catch(e=>{console.error('MISSING_AREA_FATAL',e);process.exitCode=1});
          NODE
      - name: Persist result metadata and run URL
        if: always()
        run: |
          if [ ! -s missing-area-research.json ]; then echo '{"status":"test_failed_before_results"}' > missing-area-research.json; fi
          node <<'NODE'
          const fs=require('node:fs'),j=JSON.parse(fs.readFileSync('missing-area-research.json','utf8'));
          j.workflowUrl=process.env.GITHUB_SERVER_URL+'/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID;
          j.sourceCommit=process.env.GITHUB_SHA;
          fs.writeFileSync('docs/research/photon-four-missing-result.json',JSON.stringify(j,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/photon-four-missing-result.json
          git commit -m 'test-results: record Photon search for remaining four areas' || exit 0
          git push origin HEAD:feature/leaflet-modular-core
      - name: Upload metadata artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-four-missing-result
          path: missing-area-research.json

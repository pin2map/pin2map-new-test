name: Coordinate-only Photon thematic filters research
on:
  push:
    branches: [feature/leaflet-modular-core]
    paths: ['.github/workflows/photon-thematic-coordinate-research.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaflet-modular-core
          persist-credentials: true
      - name: Test generic thematic reverse filters, no location names
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          node <<'NODE'
          "use strict";
          (async()=>{
            const fs=require('node:fs'),{chromium}=require('playwright');
            const fixtures=require('./tests/area-source-fixtures.cjs');
            const selected=['Lake Kivu','Parque Nacional Torres del Paine'];
            const points=fixtures.filter(x=>selected.includes(x.name));
            const filters=[
              {id:'natural',tag:'natural'},
              {id:'water',tag:'water'},
              {id:'boundary',tag:'boundary'},
              {id:'leisure',tag:'leisure'},
              {id:'other',layer:'other'}
            ];
            // All filters are generic and identical across all points.
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox'],headless:true});
            let rows;
            try{
              const page=await browser.newPage();
              await page.goto('https://pin2map.github.io/pin2map-new-test/preview/',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>!!window.Pin2MapAreaGeometry?.containsPoint);
              rows=await page.evaluate(async({points,filters})=>{
                const sleep=ms=>new Promise(r=>setTimeout(r,ms));
                const req=async u=>{
                  const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);
                  try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);
                    return {status:'ok',data:await r.json()}}
                  catch(e){return {status:'failed',error:String(e).slice(0,140)}}
                  finally{clearTimeout(t)}
                };
                const results=[];
                for(const point of points){
                  const potential=new Map(),filterStats=[];
                  for(const filter of filters){
                    await sleep(1400);
                    const u=new URL('https://photon.komoot.io/reverse');
                    u.searchParams.set('lat',String(point.lat));u.searchParams.set('lon',String(point.lng));
                    u.searchParams.set('radius','150');u.searchParams.set('limit','50');u.searchParams.set('lang','en');
                    if(filter.tag)u.searchParams.append('osm_tag',filter.tag);
                    if(filter.layer)u.searchParams.append('layer',filter.layer);
                    const r=await req(u),features=r.data?.features||[];
                    const entries=features.map(f=>({name:f.properties?.name||null,
                      id:f.properties?.osm_type&&f.properties?.osm_id?
                        String(f.properties.osm_type).toUpperCase()+f.properties.osm_id:null,
                      key:f.properties?.osm_key||null,value:f.properties?.osm_value||null}));
                    for(const entry of entries)
                      if(entry.id&&/^[WR]\d+$/.test(entry.id)&&!potential.has(entry.id))potential.set(entry.id,entry);
                    filterStats.push({filter:filter.id,status:r.status,error:r.error,count:entries.length,
                      sample:entries.slice(0,12)});
                  }
                  const lookupRows=[],candidates=[...potential.values()];
                  // Fairly sample categories. A generic nearby lake must not
                  // crowd out a national park, or vice versa. No name/ID hints.
                  const buckets=[
                    candidates.filter(x=>x.key==='boundary'&&['national_park','protected_area'].includes(x.value)),
                    candidates.filter(x=>x.key==='water'&&['lake','reservoir'].includes(x.value)),
                    candidates.filter(x=>x.key==='leisure'&&x.value==='nature_reserve'),
                    candidates.filter(x=>x.key==='natural'&&x.value==='water'),
                    candidates.filter(x=>['boundary','water','leisure','natural','landuse'].includes(x.key))
                  ];
                  const ranked=[],seen=new Set();
                  // First 4 buckets get 5 candidates each, then 4 generic
                  // fallbacks; no dependence on query result insertion order.
                  for(let b=0;b<buckets.length;b++){
                    let taken=0;
                    for(const candidate of buckets[b]){
                      if(seen.has(candidate.id))continue;
                      seen.add(candidate.id);ranked.push(candidate);taken++;
                      if(taken>=(b===4?4:5))break;
                    }
                  }
                  for(let i=0;i<ranked.length;i+=8){
                    await sleep(1500);
                    const ids=ranked.slice(i,i+8).map(x=>x.id),u=new URL('https://nominatim.openstreetmap.org/lookup');
                    u.searchParams.set('osm_ids',ids.join(','));u.searchParams.set('format','json');
                    u.searchParams.set('polygon_geojson','1');u.searchParams.set('polygon_threshold','0');
                    const r=await req(u);
                    if(r.status==='failed'){lookupRows.push({batch:ids,status:'failed',error:r.error});continue}
                    for(const o of r.data||[]){
                      const id=o.osm_type?.[0]?.toUpperCase()+o.osm_id,g=o.geojson;
                      const contains=['Polygon','MultiPolygon'].includes(g?.type)&&
                        window.Pin2MapAreaGeometry.containsPoint(g,point.lng,point.lat);
                      lookupRows.push({id,name:o.name||o.display_name?.split(',')[0]||null,
                        geometryType:g?.type||null,containsPoint:contains});
                    }
                  }
                  const row={expected:point.name,lat:point.lat,lng:point.lng,
                    candidateCount:potential.size,selectedIds:ranked.map(x=>x.id),filters:filterStats,
                    checked:lookupRows.length,contains:lookupRows.filter(x=>x.containsPoint),
                    failedBatches:lookupRows.filter(x=>x.status==='failed')};
                  console.log('THEMATIC_COORD',JSON.stringify(row));
                  results.push(row);
                }
                return results;
              },{points,filters});
            }finally{await browser.close()}
            const targets={'Lake Kivu':'R9072','Parque Nacional Torres del Paine':'R2622290'};
            for(const row of rows)row.targetFound=row.contains.some(x=>x.id===targets[row.expected]);
            const summary={tested:rows.length,targetsFound:rows.filter(x=>x.targetFound).length,
              extraContainment:rows.map(x=>({name:x.expected,contains:x.contains.map(v=>v.id)}))};
            console.log('THEMATIC_SUMMARY',JSON.stringify(summary));
            fs.writeFileSync('thematic-coordinate-result.json',JSON.stringify({
              testedAt:new Date().toISOString(),summary,rows,
              caveat:'Names and expected IDs only used for local evaluation, never in any request.'},null,2)+'\n');
          })().catch(e=>{console.error('THEMATIC_FATAL',e);process.exitCode=1});
          NODE
      - name: Record research and run reference
        if: always()
        run: |
          if [ ! -s thematic-coordinate-result.json ]; then echo '{"status":"test_failed_before_results"}' > thematic-coordinate-result.json; fi
          node <<'NODE'
          const fs=require('node:fs'),j=JSON.parse(fs.readFileSync('thematic-coordinate-result.json'));
          j.sourceCommit=process.env.GITHUB_SHA;
          j.workflowUrl=process.env.GITHUB_SERVER_URL+'/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID;
          fs.writeFileSync('docs/research/photon-thematic-coordinate-result.json',JSON.stringify(j,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/photon-thematic-coordinate-result.json
          git commit -m 'test-results: record thematic Photon coordinate lookup' || exit 0
          git push origin HEAD:feature/leaflet-modular-core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thematic-coordinate-results
          path: thematic-coordinate-result.json

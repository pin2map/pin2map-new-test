name: OSM API full to GeoJSON independent research (five fixtures)
on:
  push:
    branches: [feature/leaflet-modular-core]
    paths: ['.github/workflows/osm-raw-geometry-research.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leaflet-modular-core
          persist-credentials: true
      - name: Prepare standalone OSM XML to GeoJSON converter
        run: |
          npm install --no-save --no-audit --no-fund osmtogeojson@3.0.0-beta.5 @xmldom/xmldom@0.8.10 playwright@1.56.1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || true)
          test -n "$CHROME"
          echo "PIN2MAP_CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
      - name: Check raw OSM geometry conversion and Marradong retry in real Chromium
        run: |
          node <<'NODE'
          "use strict";
          (async()=>{
          const fs=require('node:fs'),osmToGeoJSON=require('osmtogeojson'),{DOMParser}=require('@xmldom/xmldom');
          const {chromium}=require('playwright'),area=require('./domain/area-geometry.js');
          const fixtures=require('./tests/area-source-fixtures.cjs');
          const sample=[
            ['Enoggera Reservoir','way',8113068],
            ['Marradong Mining Area','relation',14893603],
            ['Farihy Ihotry','way',75250501],
            ['Embalse Rio Hondo','relation',7138909],
            ['Heaven Lake','relation',11650508]
          ];
          const rows=[];
          for(const [name,type,id] of sample){
            const point=fixtures.find(p=>p.name===name),started=Date.now();
            const ctrl=new AbortController(),timeout=setTimeout(()=>ctrl.abort(),30000);
            try{
              const response=await fetch('https://api.openstreetmap.org/api/0.6/'+type+'/'+id+'/full',{
                signal:ctrl.signal,headers:{'User-Agent':'pin2map-independent-research/1.0 (https://github.com/pin2map/pin2map-new-test)'}});
              if(!response.ok)throw Error('HTTP '+response.status);
              const xml=await response.text();
              const geojson=osmToGeoJSON(new DOMParser().parseFromString(xml,'text/xml'));
              const feature=geojson.features.find(f=>f.id===type+'/'+id);
              const polygon=feature&&['Polygon','MultiPolygon'].includes(feature.geometry?.type);
              rows.push({name,type,id,status:'ok',ms:Date.now()-started,
                features:geojson.features.length,polygonType:feature?.geometry?.type||null,
                vertexCount:polygon?area.pointCount(feature.geometry):0,
                containsClickPoint:polygon?area.containsPoint(feature.geometry,point.lng,point.lat):false});
            }catch(e){rows.push({name,type,id,status:'failed',error:String(e).slice(0,180)});}
            finally{clearTimeout(timeout)}
            console.log('OSM_XML_GEOJSON',JSON.stringify(rows[rows.length-1]));
          }
          const browser=await chromium.launch({headless:true,
            executablePath:process.env.PIN2MAP_CHROMIUM_EXECUTABLE,args:['--no-sandbox']});
          let checks;
          try{
            const page=await browser.newPage();
            await page.goto('https://pin2map.github.io/pin2map-new-test/preview/',{waitUntil:'domcontentloaded'});
            checks=await page.evaluate(async()=>{
              const results={};
              for(const [key,url] of Object.entries({
                directOsm:'https://api.openstreetmap.org/api/0.6/relation/14893603/full',
                nominatim:'https://nominatim.openstreetmap.org/lookup?osm_ids=R14893603&format=json&polygon_geojson=1'})){
                const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),25000);
                try{
                  const response=await fetch(url,{signal:controller.signal});
                  const text=await response.text();
                  if(!response.ok)throw Error('HTTP '+response.status);
                  let polygon=null,contains=false;
                  if(key==='nominatim'){
                    const hit=JSON.parse(text)[0];polygon=hit?.geojson?.type||null;
                    if(['Polygon','MultiPolygon'].includes(polygon))
                      contains=window.Pin2MapAreaGeometry.containsPoint(hit.geojson,116.434307,-32.838924);
                  }
                  results[key]={status:'ok',http:response.status,bytes:text.length,polygonType:polygon,containsClickPoint:contains};
                }catch(e){results[key]={status:'failed',error:String(e).slice(0,160)}}
                finally{clearTimeout(timeout)}
              }
              return results;
            });
          }finally{await browser.close()}
          const summary={converted:rows.filter(x=>x.status==='ok').length,polygon:rows.filter(x=>['Polygon','MultiPolygon'].includes(x.polygonType)).length,
            containsClickPoint:rows.filter(x=>x.containsClickPoint).length,osmApiBrowserCors:checks.directOsm?.status,
            marradongNominatimRetry:checks.nominatim};
          console.log('RAW_OSM_SUMMARY',JSON.stringify(summary));
          fs.writeFileSync('osm-raw-research-result.json',JSON.stringify({testedAt:new Date().toISOString(),
            note:'Research only. OSM API is editing API and not appropriate as mass production read service; no geometry stored.',
            rows,checks,summary},null,2)+'\n');
          })().catch(e=>{console.error('RAW_OSM_FATAL',e);process.exitCode=1});
          NODE
      - name: Record metadata result with run URL
        if: always()
        run: |
          if [ ! -s osm-raw-research-result.json ]; then echo '{"status":"test_failed_before_results"}' > osm-raw-research-result.json; fi
          node <<'NODE'
          const fs=require('node:fs'),j=JSON.parse(fs.readFileSync('osm-raw-research-result.json','utf8'));
          j.workflowUrl=process.env.GITHUB_SERVER_URL+'/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID;
          j.sourceCommit=process.env.GITHUB_SHA;
          fs.writeFileSync('docs/research/osm-raw-geometry-result.json',JSON.stringify(j,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/osm-raw-geometry-result.json
          git commit -m 'test-results: record direct OSM XML to polygon geometry research' || exit 0
          git push origin HEAD:feature/leaflet-modular-core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osm-raw-geometry-results
          path: osm-raw-research-result.json

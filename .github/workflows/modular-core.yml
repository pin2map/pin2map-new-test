name: Modular core checks
on:
  push:
    branches: [feature/leaflet-modular-core]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check JavaScript modules
        run: |
          find domain application adapters ui -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check app.js
          node --check map-adapter-leaflet.js
          node --check sw.js
      - name: Run modular tests
        run: node --test tests/*.test.js

  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for this smoke test
        run: npm install --no-save playwright@1.56.1
      - name: Use preinstalled Google Chrome on the GitHub runner
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || true)
          if [ -z "$CHROME" ]; then
            echo "No system Chrome found on runner" >&2
            exit 1
          fi
          echo "PIN2MAP_CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
      - name: Serve development checkout on localhost
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pin2map-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pin2map-server.log
          exit 1
      - name: Test real browser interactions and offline reload
        run: node tests/browser-smoke.cjs
      - name: Save browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-failure-screenshot
          path: browser-smoke-failure.png
          if-no-files-found: ignore

  dispatch-preview:
    # Safe diagnostics only for this repository's isolated QA PR.
    if: github.event_name == 'pull_request' && github.base_ref == 'feature/leaflet-modular-core' && github.head_ref == 'qa/search-results-v132-ci'
    needs: [node-tests, chromium-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: Trigger standard feature-branch Pages deployment and await result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=pin2map/pin2map-new-test
          gh workflow run preview-pages.yml --ref feature/leaflet-modular-core -R "$repo"
          for attempt in $(seq 1 20); do
            id=$(gh run list -R "$repo" --workflow=preview-pages.yml --branch=feature/leaflet-modular-core --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$id" ]; then break; fi
            sleep 3
          done
          test -n "${id:-}"
          echo "Feature-branch Pages run: https://github.com/$repo/actions/runs/$id"
          gh run watch "$id" -R "$repo" --exit-status

  published-preview-acceptance:
    # PR against the development branch provides a readable independent HTTPS gate.
    if: github.event_name == 'pull_request' && github.base_ref == 'feature/leaflet-modular-core'
    needs: [dispatch-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual published preview files and version over HTTPS
        run: |
          python3 - <<'PY'
          import re,time,urllib.request
          from pathlib import Path
          base="https://pin2map.github.io/pin2map-new-test/preview/"
          source=Path("sw.js").read_text()
          match=re.search(r"const CACHE='pin2map-new-v(\d+)'",source)
          assert match,"Missing source version"
          expected="pin2map-preview-v"+match.group(1)
          assets={
            "sw.js":expected,
            "index.html":expected,
            "ui/search-results.js":"results-footer",
            "styles.css":".results-footer"
          }
          for attempt in range(12):
            failures=[]
            for path,marker in assets.items():
              request=urllib.request.Request(base+path,headers={"Cache-Control":"no-cache"})
              try:
                with urllib.request.urlopen(request,timeout=15) as response:
                  content=response.read().decode("utf-8")
                if marker not in content: failures.append(path+": missing "+marker)
                if path=="ui/search-results.js" and "results-head" in content:
                  failures.append(path+": old header still in published module")
              except Exception as error: failures.append(path+": "+str(error))
            if not failures:
              print("PASS published preview files:",expected)
              break
            print("Attempt",attempt+1,failures,flush=True)
            if attempt==11: raise SystemExit("Published preview is not updated")
            time.sleep(10)
          PY
      - name: Use system Chrome and test real published search results
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable)
          PIN2MAP_CHROMIUM_EXECUTABLE="$CHROME" PIN2MAP_LIVE_PREVIEW="https://pin2map.github.io/pin2map-new-test/preview/" node tests/preview-live-smoke.cjs

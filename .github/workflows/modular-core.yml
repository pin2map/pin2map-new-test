name: Modular core checks
on:
  push:
    branches: [feature/leaflet-modular-core]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check JavaScript modules
        run: |
          find domain application adapters ui -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check app.js
          node --check map-adapter-leaflet.js
          node --check sw.js
      - name: Run modular tests
        run: node --test tests/*.test.js

  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for this smoke test
        run: npm install --no-save playwright@1.56.1
      - name: Use preinstalled Google Chrome on the GitHub runner
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || true)
          if [ -z "$CHROME" ]; then
            echo "No system Chrome found on runner" >&2
            exit 1
          fi
          echo "PIN2MAP_CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
      - name: Serve development checkout on localhost
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pin2map-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pin2map-server.log
          exit 1
      - name: Test real browser interactions and offline reload
        run: node tests/browser-smoke.cjs
      - name: Save browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-failure-screenshot
          path: browser-smoke-failure.png
          if-no-files-found: ignore







  qa-v143-pages:
    if: github.event_name == 'pull_request' && github.base_ref == 'feature/leaflet-modular-core' && github.head_ref == 'qa/map-menus-v143'
    needs: [node-tests, chromium-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch official feature-only Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=pin2map/pin2map-new-test
          run_url=$(gh workflow run preview-pages.yml --ref feature/leaflet-modular-core -R "$repo")
          id="${run_url##*/}"
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "Unexpected dispatch: $run_url"; exit 1; }
          echo "Feature Pages run: $run_url"
          gh run watch "$id" -R "$repo" --exit-status

  qa-v143-live:
    if: github.event_name == 'pull_request' && github.base_ref == 'feature/leaflet-modular-core' && github.head_ref == 'qa/map-menus-v143'
    needs: [qa-v143-pages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published v143 HTTPS assets
        run: |
          python3 - <<'PY'
          import urllib.request
          base="https://pin2map.github.io/pin2map-new-test/preview/"
          expected={"sw.js":"pin2map-preview-v143",
            "index.html":'id="searchClear"',
            "ui/search-form.js":"clearInput()",
            "ui/shell.js":'this.element("settingsButton").setAttribute("aria-expanded"',
            "styles.css":"--p2m-map-control-bg:#1764bf"}
          for path,marker in expected.items():
            req=urllib.request.Request(base+path,headers={"Cache-Control":"no-cache"})
            with urllib.request.urlopen(req,timeout=15) as response:
              content=response.read().decode("utf-8")
            assert marker in content,path+" lacks published v143 contract"
          print("PASS published HTTPS assets: pin2map-preview-v143")
          PY
      - name: Live Chromium on phone tablet and desktop
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable)
          PIN2MAP_CHROMIUM_EXECUTABLE="$CHROME" PIN2MAP_LIVE_PREVIEW="https://pin2map.github.io/pin2map-new-test/preview/" node tests/preview-live-smoke.cjs

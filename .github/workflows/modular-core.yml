name: Modular core checks
on:
  push:
    branches: [feature/leaflet-modular-core]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check JavaScript modules
        run: |
          find domain application adapters ui -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check app.js
          node --check map-adapter-leaflet.js
          node --check sw.js
      - name: Run modular tests
        run: node --test tests/*.test.js

  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for this smoke test
        run: npm install --no-save playwright@1.56.1
      - name: Use preinstalled Google Chrome on the GitHub runner
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || true)
          if [ -z "$CHROME" ]; then
            echo "No system Chrome found on runner" >&2
            exit 1
          fi
          echo "PIN2MAP_CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
      - name: Serve development checkout on localhost
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pin2map-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pin2map-server.log
          exit 1
      - name: Test real browser interactions and offline reload
        run: node tests/browser-smoke.cjs
      - name: Verify real overlap tap zoom and precise pin choice on desktop iPhone and iPad
        run: node tests/pin-overlap-browser.cjs
      - name: Verify responsive pin dialog, popup containment and capture visual evidence
        run: node tests/pin-dialog-visual.cjs
      - name: Publish responsive dialog screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pin-dialog-responsive-screenshots
          path: pin-dialog-visual-artifacts/*.png
          if-no-files-found: ignore
      - name: Save browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-failure-screenshot
          path: browser-smoke-failure.png
          if-no-files-found: ignore








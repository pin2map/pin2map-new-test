name: Modular core checks
on:
  push:
    branches: [feature/leaflet-modular-core]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check JavaScript modules
        run: |
          find domain application adapters ui -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check app.js
          node --check map-adapter-leaflet.js
          node --check sw.js
      - name: Run modular tests
        run: node --test tests/*.test.js

  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for this smoke test
        run: npm install --no-save playwright@1.56.1
      - name: Use preinstalled Google Chrome on the GitHub runner
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || true)
          if [ -z "$CHROME" ]; then
            echo "No system Chrome found on runner" >&2
            exit 1
          fi
          echo "PIN2MAP_CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
      - name: Serve development checkout on localhost
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pin2map-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pin2map-server.log
          exit 1
      - name: Test real browser interactions and offline reload
        run: node tests/browser-smoke.cjs
      - name: Save browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-failure-screenshot
          path: browser-smoke-failure.png
          if-no-files-found: ignore



  qa-v138-pages:
    if: github.event_name == 'pull_request' && github.base_ref == 'feature/leaflet-modular-core' && github.head_ref == 'qa/search-pin-name-v138'
    needs: [node-tests, chromium-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch feature-only preview Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=pin2map/pin2map-new-test
          run_url=$(gh workflow run preview-pages.yml --ref feature/leaflet-modular-core -R "$repo")
          id="${run_url##*/}"
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "Unexpected dispatch response: $run_url"; exit 1; }
          echo "Feature Pages run: $run_url"
          gh run watch "$id" -R "$repo" --exit-status

  qa-v138-live:
    if: github.event_name == 'pull_request' && github.base_ref == 'feature/leaflet-modular-core' && github.head_ref == 'qa/search-pin-name-v138'
    needs: [qa-v138-pages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify v138 was actually published over HTTPS
        run: |
          python3 - <<'PY'
          import re,urllib.request
          from pathlib import Path
          base="https://pin2map.github.io/pin2map-new-test/preview/"
          match=re.search(r"const CACHE='pin2map-new-v(\d+)'",Path("sw.js").read_text())
          assert match
          version="pin2map-preview-v"+match.group(1)
          files={"sw.js":version,"index.html":version,
            "domain/place-search.js":"function pinName(result)",
            "app.js":"placeDomain.pinName(result)"}
          for path,marker in files.items():
            request=urllib.request.Request(base+path,headers={"Cache-Control":"no-cache"})
            with urllib.request.urlopen(request,timeout=15) as response:
              content=response.read().decode("utf-8")
            assert marker in content, path+" does not match "+version
          print("PASS published preview:",version)
          PY
      - name: Check published street-name transfer on phone tablet desktop
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          CHROME=$(command -v google-chrome || command -v google-chrome-stable)
          PIN2MAP_CHROMIUM_EXECUTABLE="$CHROME" PIN2MAP_LIVE_PREVIEW="https://pin2map.github.io/pin2map-new-test/preview/" node tests/preview-live-smoke.cjs
